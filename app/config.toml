# Tafrigh (تفريغ) — settings for the transcription app.
#
# Run from source: ./app.sh (browser tab) or .venv/bin/python -m app.desktop (desktop window).
# Paths below are relative to the data folder: the project folder when run from source, a per-user
# folder in the desktop build (%LOCALAPPDATA%\Tafrigh on Windows, ~/.local/share/tafrigh on Linux).
# Personal overrides go in <data folder>/app_data/config.toml (same layout): a [[models]] entry there
# with the same id replaces only the fields it lists. API keys are entered in the app (Settings),
# which saves them to app_data/secrets.json, or come from the environment variables in key_env.

[server]
host = "127.0.0.1"          # local only: the app has no login, so don't expose it on a network
port = 8765
open_browser = true         # ./app.sh opens a browser tab (the desktop app opens its own window)

[storage]
dir = "app_data"            # one folder per transcription: 16 kHz audio, transcript, log (git-ignored)
keep_original = false       # also keep the uploaded file (a video can be 100x the size of the audio)
max_upload_gb = 4

[defaults]
model = "whisper-medium"
speakers = "auto"           # "none", "auto" (estimate the number) or a number
language = "ar"             # "ar", "en" or "auto"

[local]
# python = ""               # interpreter for local runs; default: the one running the app
threads = 10                # CPU threads for the local models
voiceprint_model = "models/diarization/nemo_en_titanet_small.onnx"
# Switch the laptop to the performance power profile while local jobs run, and back afterwards
# (Linux, powerprofilesctl). Power-saver makes local models about 3-5x slower.
performance_while_running = false

# Files the app downloads (Settings → Models), pinned to a revision and checked by size and SHA-256.
[[local.voiceprint_files]]
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/nemo_en_titanet_small.onnx"
path = "models/diarization/nemo_en_titanet_small.onnx"
size = 40257283
sha256 = "ad4a1802485d8b34c722d2a9d04249662f2ece5d28a7a039063ca22f515a789e"

# ---------------------------------------------------------------------------------------------
# Models. kind = "local" runs on this computer through transcribe.py; kind = "hosted" uploads the
# recording to the service (the app asks for confirmation every time).
# rtf = processing time / audio length measured on the test laptop in performance mode, for estimates.
# ---------------------------------------------------------------------------------------------

[[models]]
id = "whisper-medium"
kind = "local"
engine = "whisper"
whisper_model = "models/whisper-medium-arabic-codeswitched-ct2"
title = "whisper-medium code-switching"
tagline = "Keeps English terms in English"
facts = ["18.5% WER on the public Egyptian set", "48.8% different from ElevenLabs on real meetings",
         "English kept: 90% / 57%", "Word timestamps"]
rtf = 0.55
prompt = true               # accepts a vocabulary / style hint

