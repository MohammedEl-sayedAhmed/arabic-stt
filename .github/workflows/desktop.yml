# Build and check the desktop app on Windows and Linux.
# Runs only when started by hand (Actions → Desktop build → Run workflow, or `gh workflow run desktop.yml`)
# or for a version tag. A tag (git tag v0.1.0 && git push origin v0.1.0) also publishes a GitHub release
# with the Windows installer, the Linux build and their checksums; the tag must match app/__init__.py.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Version
        id: version
        run: |
          version=$(python -c "import app; print(app.__version__)")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match app/__init__.py ($version)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tests (the hosted services are local stand-ins; no models needed)
        run: python -m unittest discover -s tests -v
        env:
          # the browser tests (tests/test_ui*.py) run in the runner's Chrome; fail rather than skip without it
          TAFRIGH_UI_REQUIRED: "1"

      - name: Self-test from source
        run: python -m app.desktop --self-test --report selftest-source.json

      - name: Build
        run: python desktop/build.py

      - name: Self-test the build (Linux)
        if: runner.os == 'Linux'
        run: dist/Tafrigh/Tafrigh --self-test --report selftest-build.json

      - name: Self-test the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # a windowed .exe doesn't block the shell or print: wait for it and read its report
          $report = Join-Path $PWD "selftest-build.json"
          $p = Start-Process -FilePath dist\Tafrigh\Tafrigh.exe -ArgumentList "--self-test","--report","`"$report`"" -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - name: Real model test (Windows build; downloads whisper-medium, ~820 MB)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-models.json"
          $p = Start-Process -FilePath dist\Tafrigh\Tafrigh.exe -ArgumentList "--self-test","--models","--report","`"$report`"" -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - name: Window test (Windows, WebView2)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-window.json"
          $p = Start-Process -FilePath dist\Tafrigh\Tafrigh.exe -ArgumentList "--self-test","--window","--report","`"$report`"" -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - name: Installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          $env:TAFRIGH_VERSION = "${{ steps.version.outputs.version }}"
          & $iscc desktop\installer.iss

      - name: Self-test reports
        if: always()
        run: cat selftest-*.json || true

      - name: Upload the Windows installer
        if: runner.os == 'Windows' && hashFiles('dist/Tafrigh-*-setup.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Tafrigh-windows-setup
          path: dist/Tafrigh-*-setup.exe
          retention-days: 7

      - name: Upload the Windows build folder (when there is no installer)
        if: runner.os == 'Windows' && hashFiles('dist/Tafrigh-*-setup.exe') == ''
        uses: actions/upload-artifact@v4
        with:
          name: Tafrigh-windows
          path: dist/Tafrigh
          retention-days: 7

      - name: Linux archive (version tags)
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        run: tar -czf "dist/Tafrigh-${{ steps.version.outputs.version }}-linux-x64.tar.gz" -C dist Tafrigh

      - name: Upload the Linux archive
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Tafrigh-linux
          path: dist/Tafrigh-*-linux-x64.tar.gz
          retention-days: 7

  release:
    # A version tag: publish the installer and the Linux build as a GitHub release.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # by name: a tag without the Windows installer or the Linux archive must not be published
      - uses: actions/download-artifact@v4
        with:
          name: Tafrigh-windows-setup
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: Tafrigh-linux
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          ls -la
          sha256sum * > SHA256SUMS.txt
          notes="../.github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Tafrigh ${GITHUB_REF_NAME#v}" "$@"
